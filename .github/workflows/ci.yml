name: ci
on:
  push:
    branches:
      - master
  pull_request: {}

jobs:
  ruby:
    name: ruby
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby_version: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '${{ matrix.ruby_version }}'
          bundler-cache: true

      - run: 'bundle exec rake'

  truffleruby:
    name: truffleruby
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby_version: [truffleruby-head]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '${{ matrix.ruby_version }}'
          bundler-cache: true

      - run: 'bundle exec rake'
